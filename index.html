</head>

  <div class="wrap">

    <section id="sec-quiz" class="card hidden">
      <div class="top">
        <div>
          <b id="title"></b>
          <div class="muted" id="num"></div>
        </div>
        <div class="score" id="score">0</div>
      </div>
      <div class="progress">
        <div id="bar" class="bar"></div>
      </div>
      <h2 id="q"></h2>
      <div id="ans" class="answers"></div>
      <div id="fb" class="fb hidden"></div>
      <div class="nav">
        <button onclick="goHome()">🏠 Home</button>
        <button id="next" onclick="next()" disabled>Soal Berikutnya ➜</button>
      </div>
    </section>

    <!-- SECTION RESULT -->

      <p id="ft"></p>
      <div id="advice" class="fb"></div>

      <button onclick="goHome()">🔄 Pilih Mapel Lagi</button>
    </section>

  ['Dalam voli pemain tidak boleh',['Menangkap atau melempar bola','Passing','Smash','Blocking'],0,'Bola harus dipukul, bukan ditangkap/dilempar. Saran: pahami karakter dasar voli.'],
  ['Selain latihan, performa olahraga membutuhkan',['Istirahat dan pemulihan cukup','Tidak makan','Kurang tidur','Tidak minum'],0,'Pemulihan membantu tubuh siap beraktivitas. Saran: seimbangkan latihan, nutrisi, hidrasi, istirahat.'],
  ['Operan basket kepada rekan yang sedang berlari sebaiknya diarahkan',['Ke ruang yang akan dituju rekan','Asal jauh','Ke belakang ring','Tidak dioper'],0,'Operan dapat diarahkan ke ruang gerak rekan. Saran: baca pergerakan rekan.'],
  ['Kerja sama setter dan spiker terutama untuk',['Membangun serangan','Menghentikan pertandingan','Dribbling','Mengubah lapangan'],0,'Setter menyiapkan bola dan spiker menyerang. Saran: pahami peran tiap posisi sebagai sistem.']
];

let data = [], i = 0, sc = 0, done = false, sub = '';

// Mengakses Elemen DOM secara Aman
const elHome = document.getElementById('sec-home');
const elQuiz = document.getElementById('sec-quiz');
const elResult = document.getElementById('sec-result');
const elTitle = document.getElementById('title');
const elNum = document.getElementById('num');
const elScore = document.getElementById('score');
const elBar = document.getElementById('bar');
const elQ = document.getElementById('q');
const elAns = document.getElementById('ans');
const elFb = document.getElementById('fb');
const elNext = document.getElementById('next');
const elFinal = document.getElementById('final');
const elFt = document.getElementById('ft');
const elAdvice = document.getElementById('advice');

function start(x) {
  sub = x;
  data = (x === 'ipa') ? I : P;
  i = 0;
  sc = 0;
  elHome.classList.add('hidden');
  elResult.classList.add('hidden');
  elQuiz.classList.remove('hidden');
  render();
}

function render() {
  done = false;
  let a = data[i];
  elTitle.textContent = (sub === 'ipa') ? '🔬 IPA' : '🏀 PJOK';
  elNum.textContent = `Soal ${i + 1} dari ${data.length}`;
  elQ.textContent = a[0];
  elScore.textContent = sc;
  elBar.style.width = ((i / data.length) * 100) + '%';
  elFb.className = 'fb hidden';
  
  elNext.disabled = true;
  elNext.textContent = (i === data.length - 1) ? 'Lihat Hasil 🎯' : 'Soal Berikutnya ➜';
  
  elAns.innerHTML = '';
  a[1].forEach((v, n) => {
    let b = document.createElement('button');
    b.textContent = String.fromCharCode(65 + n) + '. ' + v;
    b.onclick = () => answer(n, b);
    elAns.appendChild(b);
  });
}

function answer(c, b) {
  if (done) return;
  done = true;
  let a = data[i];
  let bs = [...elAns.children];
  
  bs.forEach(x => x.disabled = true);
  bs[a[2]].classList.add('correct');
  
  if (c === a[2]) {
    sc++;
    b.classList.add('correct');
    elFb.className = 'fb good';
    elFb.innerHTML = '<b>✅ BENAR!</b><br>Nice! ' + a[3];
  } else {
    b.classList.add('wrong');
    elFb.className = 'fb bad';
    elFb.innerHTML = '<b>❌ SALAH</b><br>Jawaban benar: <b>' + a[1][a[2]] + '</b><br>' + a[3];
  }
  
  elScore.textContent = sc;
  elNext.disabled = false;
}

function next() {
  if (!done) return;
  if (i < data.length - 1) {
    i++;
    render();
  } else {
    finish();
  }
}

function finish() {
  elQuiz.classList.add('hidden');
  elResult.classList.remove('hidden');
  let pc = Math.round((sc / data.length) * 100);
  elFinal.textContent = `${sc}/${data.length} (${pc}%)`;
  elFt.textContent = `Kuis ${sub === 'ipa' ? 'IPA' : 'PJOK'} selesai.`;
  
  if (pc >= 90) {
    elAdvice.textContent = '🔥 Mantap. Saran gw: review soal yang masih ragu dan pertahankan ritme belajar.';
  } else if (pc >= 75) {
    elAdvice.textContent = '💪 Bagus. Saran gw: ulangi soal yang salah dan fokus ke materi yang masih ketukar.';
  } else if (pc >= 60) {
    elAdvice.textContent = '📚 Lumayan. Saran gw: ulangi materi inti, terutama istilah/fungsi/aturan, lalu coba lagi.';
  } else {
    elAdvice.textContent = '🧠 Jangan panik. Saran gw: balik ke materi dasar, hafalkan konsep penting, lalu ulangi kuis sampai polanya kebaca.';
  }
}

function goHome() {
  elQuiz.classList.add('hidden');
  elResult.classList.add('hidden');
  elHome.classList.remove('hidden');
}
</script>
</body>
</html>
